[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dv360-bidkit"
version = "0.1.0"
description = "DV360 Custom Bidding DSL Linter, Pre-Flight Simulator, and Rule Compiler"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "DV360 BidKit Contributors" }
]
requires-python = ">=3.10"
keywords = [
    "dv360",
    "display-video-360",
    "custom-bidding",
    "programmatic-advertising",
    "dsp",
    "adtech"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
jinja = [
    "jinja2>=3.1.2",
]
google = [
    "google-auth>=2.20.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "jinja2>=3.1.2",
]

[project.scripts]
bidkit = "dv360_bidkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dv360_bidkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "S110", "BLE001"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
